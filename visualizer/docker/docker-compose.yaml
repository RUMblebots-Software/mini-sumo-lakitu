services:
  # Browser desktop (Xvfb + noVNC), software rendering. Works anywhere.
  robotics-web:
    profiles: ["web"]
    build: .
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      DISPLAY: ":0"
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ../ros2_ws:/root/Documents/ros2_ws
    stdin_open: true
    tty: true
    restart: unless-stopped

  # WSL2 + WSLg (GPU via d3d12)
  robotics-wsl:
    profiles: ["wsl"]
    build: .
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: wayland-0
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      GALLIUM_DRIVER: d3d12
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ../ros2_ws:/root/Documents/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg
      - /usr/lib/wsl:/usr/lib/wsl
    devices:
      - /dev/dxg:/dev/dxg
    stdin_open: true
    tty: true
    group_add:
      - video
    command: /bin/bash

  # Native desktop with Mesa CPU rendering; launch with bash run.sh native.
  robotics-native:
    profiles: ["native"]
    build: .
    # Bypass NVIDIA's runtime even when it is Docker's default on Jetson.
    runtime: runc
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      __GLX_VENDOR_LIBRARY_NAME: mesa
      XDG_RUNTIME_DIR: /tmp/runtime-root
    volumes:
      - ../ros2_ws:/root/Documents/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    stdin_open: true
    tty: true
    group_add:
      - video
    command: /bin/bash
